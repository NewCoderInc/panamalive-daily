name: Daily Instagram post

# 05:00 UTC = 00:00 in Panama -- the agenda goes out as the day starts.
# Panama does not observe DST, so this one line is correct all year.
#
# Two things follow from posting at midnight rather than in the morning.
# The date must be resolved in America/Panama, never in the runner's UTC: at
# 05:00 UTC the runner already calls it tomorrow, and a UTC date here would
# post the wrong day's agenda every single night. And GitHub's scheduler runs
# late under load -- usually a few minutes, occasionally longer -- so treat
# 00:00 as "first thing", not as a guaranteed timestamp.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to post (YYYY-MM-DD). Blank = today in Panama."
        required: false
      dry_run:
        description: "Build and commit the images, but do not post"
        type: boolean
        default: false

concurrency:
  group: daily-post          # never let two runs race the same day
  cancel-in-progress: false

permissions:
  contents: write            # to commit the day's JPEGs for Pages to serve

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Inter is what the cards are designed in. Without it Chromium falls back
      # to Liberation Sans -- readable, but a different-looking grid, and the
      # difference only shows up after the post is live.
      - name: Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-liberation fonts-noto-color-emoji ffmpeg

      - name: Playwright Chromium
        run: |
          # Pillow is what build_reel.py scales the tall render with; the
          # runner has no system PIL, and the reel step dies at import.
          pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium

      - name: Resolve the date in Panama time
        id: d
        run: |
          D="${{ github.event.inputs.date }}"
          [ -z "$D" ] && D=$(TZ=America/Panama date +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          # House naming for the deliverable: PTYLIVE_DAY_YEAR. The 00_ prefix
          # stays because the publisher selects the poster by it and the
          # carousel takes its order from filename sort -- digits sort before
          # letters, so a bare PTYLIVE_ name would fall behind 01_event.jpg.
          echo "poster=00_PTYLIVE_$(date -d "$D" +%d_%Y)" >> "$GITHUB_OUTPUT"
          echo "Building for $D"

      - name: Fetch this week's events from the live site
        run: |
          # The poster is fed by the same data panamalive.ai shows, read straight
          # from the page's EVENTS and TX arrays -- so there is no hand-copied
          # events.json to go stale. A file holding two days is exactly why three
          # midnight runs in a row found nothing and skipped.
          #
          # If the site is unreachable or its template changes, keep going with
          # the committed events.json rather than losing the day.
          python3 scripts/fetch_site_events.py --out events.json --tx-out tx.json \
            || echo "::warning::Could not read panamalive.ai - falling back to the committed events.json"

      - name: Select today's events
        id: sel
        run: |
          mkdir -p build
          set +e
          # Two densities from one day. The poster carries more rows than the
          # carousel because a reader scans it rather than swiping it.
          python3 scripts/select_today.py events.json \
              --date "${{ steps.d.outputs.date }}" --out build/poster.json --max 14 --cap-per-cat 4
          code=$?
          set -e
          # exit 3 is the deliberate "no events today" signal, not a failure.
          if [ $code -eq 3 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ $code -eq 0 ] || exit $code
          python3 scripts/select_today.py events.json \
              --date "${{ steps.d.outputs.date }}" --out build/today.json --max 8
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Render the agenda poster and the carousel
        if: steps.sel.outputs.skip != 'true'
        run: |
          # 00_agenda.jpg is the post in agenda format and slide one in
          # carousel format, so it is always built.
          python3 scripts/build_brand_poster.py build/poster.json \
              --out "docs/${{ steps.d.outputs.date }}/${{ steps.d.outputs.poster }}.jpg" \
              --tx tx.json
          python3 scripts/render_cards.py build/today.json \
              --out "docs/${{ steps.d.outputs.date }}" --tx tx.json --no-cover
          # The caption is built from the poster selection, not the carousel
          # one: it no longer lists events, so what it needs from the day is
          # the true event count and the full set of categories for hashtags.
          # promo.txt (repo root, optional) is the marketing block that sits
          # between the headline and the hashtags. Absent = headline + tags.
          python3 scripts/build_caption.py build/poster.json \
              --out build/caption.txt --tx tx.json --promo promo.txt
          # The reel needs its own caption: Instagram caps a reel at 5 hashtags
          # and Buffer refuses to queue one that goes over.
          python3 scripts/build_caption.py build/poster.json \
              --out build/caption-reel.txt --tx tx.json --promo promo.txt --max-tags 5

      - name: Render the reel
        if: steps.sel.outputs.skip != 'true'
        run: |
          # The reel carries EVERY event -- it scrolls, so it has room the 4:5
          # poster does not. assets/reel-bed.mp3 is the licensed backing track;
          # the 12s window from 0:24 is where it is already grooving.
          python3 scripts/select_today.py events.json \
              --date "${{ steps.d.outputs.date }}" --out build/reel.json \
              --max 30 --cap-per-cat 99
          ffmpeg -y -v error -ss 24 -t 14 -i assets/reel-bed.mp3 -vn \
              -af "afade=t=in:st=0:d=0.5,afade=t=out:st=12.6:d=1.4,loudnorm=I=-14:TP=-1.5:LRA=11" \
              -ar 48000 -ac 2 build/bed.wav
          python3 scripts/build_reel.py build/reel.json \
              --out "docs/${{ steps.d.outputs.date }}/${{ steps.d.outputs.poster }}_REEL.mp4" \
              --tx tx.json --seconds 14 --zoom 1.45 --audio build/bed.wav \
              --cta "FOLLOW & LIKE | @thepanamalive.ai · daily"

      - name: Build the phone page for manual posting
        if: steps.sel.outputs.skip != 'true'
        run: |
          python3 scripts/build_post_page.py build/today.json \
              --images "docs/${{ steps.d.outputs.date }}" \
              --caption build/caption.txt \
              --format "${{ vars.POST_FORMAT || 'agenda' }}" \
              --out "docs/${{ steps.d.outputs.date }}/index.html"
          python3 scripts/update_index.py --docs docs

      - name: Verify before anything is published
        if: steps.sel.outputs.skip != 'true'
        run: |
          python3 scripts/verify_post.py "docs/${{ steps.d.outputs.date }}" \
              --caption build/caption.txt

      - name: Publish the images to GitHub Pages
        if: steps.sel.outputs.skip != 'true'
        run: |
          git config user.name  "panamalive-bot"
          git config user.email "actions@github.com"
          git add "docs/${{ steps.d.outputs.date }}"
          git diff --cached --quiet || \
            git commit -m "Carousel for ${{ steps.d.outputs.date }}"
          git push

      - name: Which publisher is configured?
        id: tok
        if: steps.sel.outputs.skip != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BUFFER_API_KEY:  ${{ secrets.BUFFER_API_KEY }}
        run: |
          # Publishing mode is chosen by which secret exists -- no code change
          # to switch. Meta's own API wins if a token is ever obtained; Buffer
          # is the route while Meta's developer registration stays blocked; with
          # neither, the run builds the phone page for posting by hand.
          if   [ -n "$IG_ACCESS_TOKEN" ]; then echo "via=instagram" >> "$GITHUB_OUTPUT"
          elif [ -n "$BUFFER_API_KEY" ];  then echo "via=buffer"    >> "$GITHUB_OUTPUT"
          else echo "via=none" >> "$GITHUB_OUTPUT"
               echo "::notice::No publisher configured - built the page for manual posting instead."
          fi

      - name: Post to Instagram
        if: steps.sel.outputs.skip != 'true' && steps.tok.outputs.via == 'instagram' && github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          # POST_FORMAT (repo variable): "agenda" posts the single day-poster,
          # "carousel" posts the poster plus a slide per event, "reel" posts
          # the scrolling video. Default agenda.
          python3 scripts/publish_instagram.py "docs/${{ steps.d.outputs.date }}" \
              --caption build/caption.txt \
              --base-url "${{ vars.PAGES_BASE_URL }}/${{ steps.d.outputs.date }}" \
              --state "build/published-${{ steps.d.outputs.date }}.json" \
              --format "${{ vars.POST_FORMAT || 'agenda' }}" \
              --wait-for-urls 300 \
              --summary "$GITHUB_STEP_SUMMARY"

      - name: Post via Buffer
        if: steps.sel.outputs.skip != 'true' && steps.tok.outputs.via == 'buffer' && github.event.inputs.dry_run != 'true'
        env:
          BUFFER_API_KEY:    ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          # Buffer runs an approved Meta app, so this needs no Meta developer
          # account. It fetches the image from Pages, hence the wait; the post is
          # scheduled two minutes out and Buffer publishes it to Instagram.
          python3 scripts/publish_buffer.py "docs/${{ steps.d.outputs.date }}" \
              --caption build/caption.txt \
              --base-url "${{ vars.PAGES_BASE_URL }}/${{ steps.d.outputs.date }}" \
              --state "build/published-${{ steps.d.outputs.date }}.json" \
              --format "${{ vars.POST_FORMAT || 'agenda' }}" \
              --wait-for-urls 300 \
              --summary "$GITHUB_STEP_SUMMARY"

      - name: Also post the reel via Buffer
        if: steps.sel.outputs.skip != 'true' && steps.tok.outputs.via == 'buffer' && vars.POST_REEL == 'true' && github.event.inputs.dry_run != 'true'
        env:
          BUFFER_API_KEY:    ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          # Set the repo variable POST_REEL=true to publish the reel as well as
          # the poster. It is a separate post, queued three minutes after the
          # poster so the two do not land in the same minute.
          python3 scripts/publish_buffer.py "docs/${{ steps.d.outputs.date }}" \
              --caption build/caption-reel.txt \
              --base-url "${{ vars.PAGES_BASE_URL }}/${{ steps.d.outputs.date }}" \
              --state "build/published-reel-${{ steps.d.outputs.date }}.json" \
              --format reel --delay-minutes 5 \
              --wait-for-urls 300 \
              --summary "$GITHUB_STEP_SUMMARY"

      - name: Where to find today's post
        if: steps.sel.outputs.skip != 'true' && steps.tok.outputs.via == 'none'
        run: |
          {
            echo "## Ready to post - ${{ steps.d.outputs.date }}"
            echo
            echo "Open this on your phone, save the slides in order, copy the caption:"
            echo
            echo "**${{ vars.PAGES_BASE_URL }}/${{ steps.d.outputs.date }}/**"
            echo
            echo "Or bookmark **${{ vars.PAGES_BASE_URL }}/** - it always opens the newest day."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Token expiry check
        if: steps.tok.outputs.via == 'instagram' && always()
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/refresh_token.py || \
             echo "::warning::Instagram token check failed - it may have expired. Run refresh_token.py --refresh."

      - name: Nothing on today
        if: steps.sel.outputs.skip == 'true'
        run: |
          # Almost always means the site's week has run out: panamalive.ai
          # covers seven days per build, so the day after the last one finds no
          # rows. The fix is a fresh pty-week build, not anything in this repo.
          echo "::warning::No events for ${{ steps.d.outputs.date }} on panamalive.ai - no post made. The site's week has probably ended; run the weekly pty-week build."
          {
            echo "## No post for ${{ steps.d.outputs.date }}"
            echo
            echo "panamalive.ai has no events for this date. Its weekly build most likely"
            echo "ended before today - rebuild the week and re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the carousel images from growing forever
        if: steps.sel.outputs.skip != 'true'
        continue-on-error: true
        run: |
          # Instagram has long since cached the JPEGs it fetched, so old days
          # only cost repo size. Keep 60 days of history for spot-checks.
          cd docs && ls -d 20*-*-* 2>/dev/null | sort | head -n -60 | \
            xargs -r git rm -rq --
          cd ..
          git diff --cached --quiet || {
            git commit -m "Prune carousels older than 60 days"; git push; }
