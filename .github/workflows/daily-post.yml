name: Daily Instagram post

# 05:00 UTC = 00:00 in Panama -- the agenda goes out as the day starts.
# Panama does not observe DST, so this one line is correct all year.
#
# Two things follow from posting at midnight rather than in the morning.
# The date must be resolved in America/Panama, never in the runner's UTC: at
# 05:00 UTC the runner already calls it tomorrow, and a UTC date here would
# post the wrong day's agenda every single night. And GitHub's scheduler runs
# late under load -- usually a few minutes, occasionally longer -- so treat
# 00:00 as "first thing", not as a guaranteed timestamp.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to post (YYYY-MM-DD). Blank = today in Panama."
        required: false
      dry_run:
        description: "Build and commit the images, but do not post"
        type: boolean
        default: false

concurrency:
  group: daily-post          # never let two runs race the same day
  cancel-in-progress: false

permissions:
  contents: write            # to commit the day's JPEGs for Pages to serve

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Inter is what the cards are designed in. Without it Chromium falls back
      # to Liberation Sans -- readable, but a different-looking grid, and the
      # difference only shows up after the post is live.
      - name: Fonts
        run: |
          sudo apt-get update -qq
          # DejaVu Sans Condensed Bold is the font build_reel.py paints the CTA
          # in, and it ships in fonts-dejavu-extra -- not in the -core package
          # the runner already carries. Without it ffmpeg's drawtext aborts the
          # whole reel on a missing font file.
          sudo apt-get install -y -qq fonts-inter fonts-liberation fonts-noto-color-emoji \
                                      fonts-dejavu-core fonts-dejavu-extra

      - name: Playwright Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Resolve the date in Panama time
        id: d
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          # The input arrives via env, never pasted into the script, and must be
          # a real YYYY-MM-DD date before anything uses it.
          D="$INPUT_DATE"
          [ -z "$D" ] && D=$(TZ=America/Panama date +%F)
          if ! [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -d "$D" >/dev/null 2>&1; then
            echo "::error::Invalid date '$D' - use YYYY-MM-DD"; exit 1
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          # House naming for the deliverable: PTYLIVE_DAY_YEAR. The 00_ prefix
          # stays because the publisher selects the poster by it and the
          # carousel takes its order from filename sort -- digits sort before
          # letters, so a bare PTYLIVE_ name would fall behind 01_event.jpg.
          echo "poster=00_PTYLIVE_$(date -d "$D" +%d_%Y)" >> "$GITHUB_OUTPUT"
          echo "Building for $D"

      - name: Fetch this week's events from the live site
        id: fetch
        run: |
          # The poster is fed by the same data panamalive.ai shows, read straight
          # from the page's EVENTS and TX arrays -- so there is no hand-copied
          # events.json to go stale. A file holding two days is exactly why three
          # midnight runs in a row found nothing and skipped.
          #
          # If the site is unreachable or its template changes, keep going with
          # the committed events.json rather than losing the day.
          #
          # The fetch writes to temp files and only replaces the committed copies
          # when it fully succeeds, so a half-written file never reaches the build.
          if python3 scripts/fetch_site_events.py --out events.new.json --tx-out tx.new.json; then
            mv events.new.json events.json
            mv tx.new.json tx.json
          else
            rm -f events.new.json tx.new.json
            echo "::warning::Could not read panamalive.ai - falling back to the committed events.json"
          fi
          # tx.json only exists if a fetch has ever succeeded or it was committed.
          # Without it, render without --tx rather than crash.
          if [ -f tx.json ]; then echo "tx=--tx tx.json" >> "$GITHUB_OUTPUT"
          else echo "tx=" >> "$GITHUB_OUTPUT"
               echo "::warning::No tx.json available - rendering without it."
          fi

      - name: Select today's events
        id: sel
        run: |
          mkdir -p build
          set +e
          # Two densities from one day. The poster carries more rows than the
          # carousel because a reader scans it rather than swiping it.
          python3 scripts/select_today.py events.json \
              --date "${{ steps.d.outputs.date }}" --out build/poster.json --max 14 --cap-per-cat 4
          code=$?
          set -e
          # exit 3 is the deliberate "no events today" signal, not a failure.
          if [ $code -eq 3 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ $code -eq 0 ] || exit $code
          python3 scripts/select_today.py events.json \
              --date "${{ steps.d.outputs.date }}" --out build/today.json --max 8
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Render the agenda poster and the carousel
        if: steps.sel.outputs.skip != 'true'
        run: |
          # The 00_PTYLIVE_<day>_<year>.jpg poster is the post in agenda format
          # and slide one in carousel format, so it is always built.
          python3 scripts/build_brand_poster.py build/poster.json \
              --out "docs/${{ steps.d.outputs.date }}/${{ steps.d.outputs.poster }}.jpg" \
              ${{ steps.fetch.outputs.tx }}
          python3 scripts/render_cards.py build/today.json \
              --out "docs/${{ steps.d.outputs.date }}" --no-cover ${{ steps.fetch.outputs.tx }}
          # The caption lists the same events the reader sees: the poster's rows
          # in agenda format, the carousel's slides in carousel format.
          if [ "${{ vars.POST_FORMAT || 'agenda' }}" = "agenda" ]; then CAP_SRC=build/poster.json
          else CAP_SRC=build/today.json; fi
          python3 scripts/build_caption.py "$CAP_SRC" \
              --out build/caption.txt ${{ steps.fetch.outputs.tx }}
          # The reel is rendered from poster.json -- more rows than the carousel
          # carries -- and written into docs/ so Pages serves it, because both
          # publishers fetch media by public URL rather than uploading bytes.
          #
          # Shape is 4:5, chosen for motion rather than compatibility. A full
          # day's tall render measures ~1950px, so a 1920px 9:16 frame leaves
          # ~30px of travel: a still image with a soundtrack. Against a 1350px
          # frame the same render scrolls ~600px. 4:5 sits inside the reel
          # aspect range and plays full-bleed in the Reels tab. REEL_SHAPE
          # overrides it, but raise --zoom with 9:16 or it barely moves.
          python3 scripts/build_reel.py build/poster.json \
              --out "docs/${{ steps.d.outputs.date }}/reel.mp4" \
              --audio assets/reel-bed.mp3 \
              --shape "${{ vars.REEL_SHAPE || 'feed' }}" \
              --cta "More at PanamaLive.Ai|Follow @thepanamalive.ai" \
              ${{ steps.fetch.outputs.tx }}

      - name: Build the phone page for manual posting
        if: steps.sel.outputs.skip != 'true'
        run: |
          python3 scripts/build_post_page.py build/today.json \
              --images "docs/${{ steps.d.outputs.date }}" \
              --caption build/caption.txt \
              --format "${{ vars.POST_FORMAT || 'agenda' }}" \
              --out "docs/${{ steps.d.outputs.date }}/index.html"
          python3 scripts/update_index.py --docs docs

      - name: Verify before anything is published
        if: steps.sel.outputs.skip != 'true'
        run: |
          python3 scripts/verify_post.py "docs/${{ steps.d.outputs.date }}" \
              --caption build/caption.txt
          # verify_post.py gates JPEGs only. A reel that rendered to an empty or
          # unreadable file would otherwise reach a publish container that fails
          # minutes later with an error blaming the video, not the render.
          V="docs/${{ steps.d.outputs.date }}/reel.mp4"
          [ -s "$V" ] || { echo "::error::$V is missing or empty"; exit 1; }
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
                  -of csv=p=0 "$V" | grep -qE '^[0-9]+,[0-9]+$' \
            || { echo "::error::$V is not a readable video"; exit 1; }
          echo "reel OK: $(ffprobe -v error -select_streams v:0 \
               -show_entries stream=width,height -of csv=p=0 "$V"), $(du -h "$V" | cut -f1)"

      - name: Publish the images to GitHub Pages
        if: steps.sel.outputs.skip != 'true'
        run: |
          git config user.name  "panamalive-bot"
          git config user.email "actions@github.com"
          git add "docs/${{ steps.d.outputs.date }}"
          git diff --cached --quiet || \
            git commit -m "Carousel for ${{ steps.d.outputs.date }}"
          git pull --rebase --autostash --quiet
          git push

      - name: Which publisher is configured?
        id: tok
        if: steps.sel.outputs.skip != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BUFFER_API_KEY:  ${{ secrets.BUFFER_API_KEY }}
        run: |
          # Publishing mode is chosen by which secret exists -- no code change
          # to switch. Meta's own API wins if a token is ever obtained; Buffer
          # is the route while Meta's developer registration stays blocked; with
          # neither, the run builds the phone page for posting by hand.
          if   [ -n "$IG_ACCESS_TOKEN" ]; then echo "via=instagram" >> "$GITHUB_OUTPUT"
          elif [ -n "$BUFFER_API_KEY" ] && [ -f scripts/publish_buffer.py ]; then
               echo "via=buffer" >> "$GITHUB_OUTPUT"
          elif [ -n "$BUFFER_API_KEY" ]; then
               echo "via=none" >> "$GITHUB_OUTPUT"
               echo "::warning::BUFFER_API_KEY is set but scripts/publish_buffer.py is not in the repo - built the page for manual posting instead."
          else echo "via=none" >> "$GITHUB_OUTPUT"
               echo "::notice::No publisher configured - built the page for manual posting instead."
          fi

      - name: Post to Instagram
        if: steps.sel.outputs.skip != 'true' && steps.tok.outputs.via == 'instagram' && github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          # POST_FORMATS (repo variable): space-separated formats, published in
          # order. The default posts BOTH -- the day-poster as the grid tile and
          # the reel for reach. "carousel" swaps the poster for a slide per
          # event. Each format keeps its own state file so the "Remember what
          # was posted" step can record them independently: a re-run then skips
          # whatever already published instead of posting it twice.
          #
          # A failure in one format must not skip the other, so the loop notes
          # it and carries on, then exits non-zero at the end.
          mkdir -p .state
          rc=0
          for FMT in ${{ vars.POST_FORMATS || 'agenda reel' }}; do
            echo "::group::publishing $FMT"
            python3 scripts/publish_instagram.py "docs/${{ steps.d.outputs.date }}" \
                --caption build/caption.txt \
                --base-url "${{ vars.PAGES_BASE_URL }}/${{ steps.d.outputs.date }}" \
                --state ".state/published-${{ steps.d.outputs.date }}-$FMT.json" \
                --format "$FMT" \
                --wait-for-urls 300 \
                --summary "$GITHUB_STEP_SUMMARY" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Post via Buffer
        if: steps.sel.outputs.skip != 'true' && steps.tok.outputs.via == 'buffer' && github.event.inputs.dry_run != 'true'
        env:
          BUFFER_API_KEY:    ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          # Buffer runs an approved Meta app, so this needs no Meta developer
          # account. It fetches the image from Pages, hence the wait; the post is
          # scheduled two minutes out and Buffer publishes it to Instagram.
          mkdir -p .state
          rc=0
          for FMT in ${{ vars.POST_FORMATS || 'agenda reel' }}; do
            echo "::group::publishing $FMT via Buffer"
            python3 scripts/publish_buffer.py "docs/${{ steps.d.outputs.date }}" \
                --caption build/caption.txt \
                --base-url "${{ vars.PAGES_BASE_URL }}/${{ steps.d.outputs.date }}" \
                --state ".state/published-${{ steps.d.outputs.date }}-$FMT.json" \
                --format "$FMT" \
                --wait-for-urls 300 \
                --summary "$GITHUB_STEP_SUMMARY" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # The publish scripts record what they posted in .state/. Committing that
      # record means a re-run of the same day sees it and does not post twice.
      # Runs even if posting failed part-way, so a partial post is remembered.
      - name: Remember what was posted
        if: always() && steps.sel.outputs.skip != 'true' && (steps.tok.outputs.via == 'instagram' || steps.tok.outputs.via == 'buffer') && github.event.inputs.dry_run != 'true'
        run: |
          ls .state/published-${{ steps.d.outputs.date }}-*.json >/dev/null 2>&1 || {
            echo "No publish record written."; exit 0; }
          git add .state/published-${{ steps.d.outputs.date }}-*.json
          git diff --cached --quiet || {
            git commit -m "Publish record for ${{ steps.d.outputs.date }}"
            git pull --rebase --autostash --quiet
            git push; }

      - name: Where to find today's post
        if: steps.sel.outputs.skip != 'true' && steps.tok.outputs.via == 'none'
        run: |
          {
            echo "## Ready to post - ${{ steps.d.outputs.date }}"
            echo
            echo "Open this on your phone, save the slides in order, copy the caption:"
            echo
            echo "**${{ vars.PAGES_BASE_URL }}/${{ steps.d.outputs.date }}/**"
            echo
            echo "Or bookmark **${{ vars.PAGES_BASE_URL }}/** - it always opens the newest day."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Token expiry check
        if: steps.tok.outputs.via == 'instagram' && always()
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/refresh_token.py || \
             echo "::warning::Instagram token check failed - it may have expired. Run refresh_token.py --refresh."

      - name: Nothing on today
        if: steps.sel.outputs.skip == 'true'
        run: |
          # Almost always means the site's week has run out: panamalive.ai
          # covers seven days per build, so the day after the last one finds no
          # rows. The fix is a fresh pty-week build, not anything in this repo.
          echo "::warning::No events for ${{ steps.d.outputs.date }} on panamalive.ai - no post made. The site's week has probably ended; run the weekly pty-week build."
          {
            echo "## No post for ${{ steps.d.outputs.date }}"
            echo
            echo "panamalive.ai has no events for this date. Its weekly build most likely"
            echo "ended before today - rebuild the week and re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the carousel images from growing forever
        if: steps.sel.outputs.skip != 'true'
        continue-on-error: true
        run: |
          # Instagram has long since cached the JPEGs it fetched, so old days
          # only cost repo size. Keep 60 days of history for spot-checks.
          cd docs && ls -d 20*-*-* 2>/dev/null | sort | head -n -60 | \
            xargs -r git rm -rq --
          cd ..
          ls .state/published-*.json 2>/dev/null | sort | head -n -60 | \
            xargs -r git rm -q --
          # The index was built before pruning; rebuild it so it never links to
          # a day that was just removed.
          python3 scripts/update_index.py --docs docs
          git add docs
          git diff --cached --quiet || {
            git commit -m "Prune carousels older than 60 days"
            git pull --rebase --autostash --quiet
            git push; }
